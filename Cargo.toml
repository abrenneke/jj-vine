[package]
name = "jj-vine"
description = "Stacked pull requests for jj (jujutsu). Supports GitLab and bookmark-based flow."
version = "0.3.6"
edition = "2024"
repository = "https://codeberg.org/abrenneke/jj-vine"
license = "MIT"
authors = ["Andy Brenneke <andy.brenneke@gmail.com>"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["jj", "jujutsu", "merge-request", "pull-request"]
exclude = [".github/", ".vscode/", "target/", "justfile", "*.djot"]
readme = "README.md"
homepage = "https://codeberg.org/abrenneke/jj-vine"
documentation = "https://codeberg.org/abrenneke/jj-vine"

[features]
no-e2e-tests = []

[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["compile"]

[dependencies]
bon = "3.8.2"
clap = { version = "4.5.54", features = ["derive"] }
cli-table = "0.5.0"
dialoguer = "0.12.0"
enum_dispatch = "0.3.13"
futures = "0.3.31"
indicatif = "0.18.3"
itertools = "0.14.0"
jiff = "0.2.18"
owo-colors = "4.2.3"
pluralizer = "0.5.0"
regex = "1.12.3"
reqwest = { version = "0.13.1", features = [
    "json",
    "rustls",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
snafu = "0.8.9"
strip-ansi-escapes = "0.2.1"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-segmentation = "1.12.0"
urlencoding = "2.1.3"
which = "8.0.0"

[dev-dependencies]
assertables = "9.8.4"
dotenv = "0.15.0"
pretty_assertions = "1.4.1"
tempfile = "3.24.0"
uuid = { version = "1.19.0", features = ["v4"] }

[package]
name = "jj-vine"
description = "Stacked pull requests for jj (jujutsu). Supports GitLab and bookmark-based flow."
version = "0.5.4"
edition = "2024"
repository = "https://codeberg.org/abrenneke/jj-vine"
license = "MIT"
authors = ["Andy Brenneke <andy.brenneke@gmail.com>"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["jj", "jujutsu", "merge-request", "pull-request"]
exclude = [".github/", ".vscode/", "target/", "justfile", "*.djot"]
readme = "README.md"
homepage = "https://codeberg.org/abrenneke/jj-vine"
documentation = "https://codeberg.org/abrenneke/jj-vine"

[features]
no-e2e-tests = []

[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["compile"]

[dependencies]
bon = "3.9.3"
clap = { version = "4.6.3", features = ["derive"] }
cli-table = "0.5.0"
dialoguer = "0.12.0"
distill-strip-ansi = { version = "0.6.1", default-features = false, features = [
    "std",
] }
enum_dispatch = "0.3.13"
futures = "0.3.33"
indicatif = "0.18.6"
itertools = "0.15.0"
jiff = "0.2.34"
owo-colors = "4.3.0"
pluralizer = "0.5.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = [
    "json",
    "rustls",
], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = "0.9.1"
stable_try_trait_v2 = "1.75.1"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
urlencoding = "2.1.3"
which = "8.0.5"

[dev-dependencies]
assertables = "10.1.0"
dotenv = "0.15.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v4"] }

[package]
name = "jj-vine"
version = "0.1.0"
edition = "2024"
repository = "https://codeberg.org/abrenneke/jj-vine"

[features]
no-gitlab-tests = []

[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["compile"]

[dependencies]
async-trait = "0.1.89"
bon = "3.8.2"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
cli-table = "0.5.0"
dialoguer = "0.12.0"
futures = "0.3.31"
indicatif = "0.18.3"
itertools = "0.14.0"
owo-colors = "4.2.3"
reqwest = { version = "0.13.1", features = [
    "json",
    "rustls",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
snafu = "0.8.9"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"
which = "8.0.0"

[dev-dependencies]
dotenv = "0.15.0"
strip-ansi-escapes = "0.2.1"
tempfile = "3.24.0"
uuid = { version = "1.19.0", features = ["v4"] }
